<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRO — Issues Reporting Outlet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">IRO</span>
      <span class="brand-sub">Issues Reporting Outlet</span>
    </div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="report">Report an Issue</button>
      <button class="tab-btn" data-tab="dashboard">View Reports</button>
    </nav>
  </header>

  <main>
    <!-- ===================== REPORT FORM ===================== -->
    <section id="report" class="tab-panel active">
      <div class="panel-card">
        <h1>Report an Issue</h1>
        <p class="lead">Tell us what's happening in your community. Your report helps AAUA students and indigenes get issues resolved faster.</p>

        <form id="issueForm" novalidate>

          <div class="field">
            <label for="reporterName">Your name <span class="optional">(optional — leave blank to stay anonymous)</span></label>
            <input type="text" id="reporterName" placeholder="e.g. Ada Johnson">
          </div>

          <div class="field-row">
            <div class="field">
              <label for="reporterType">You are a *</label>
              <select id="reporterType" required>
                <option value="" disabled selected>Select one</option>
                <option value="Student">AAUA Student</option>
                <option value="Indigene">Indigene</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="field">
              <label for="community">Community *</label>
              <select id="community" required>
                <option value="" disabled selected>Select community</option>
                <option value="Akungba">Akungba</option>
                <option value="Iwaro">Iwaro</option>
                <option value="Etioro">Etioro</option>
                <option value="Ayegunle">Ayegunle</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="category">Issue category *</label>
            <select id="category" required>
              <option value="" disabled selected>Select category</option>
              <option value="Security">Security</option>
              <option value="Infrastructure">Infrastructure (roads, water, electricity)</option>
              <option value="Harassment">Harassment / Safety</option>
              <option value="Health">Health</option>
              <option value="Land/Housing">Land / Housing</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="field">
            <label for="title">Issue title *</label>
            <input type="text" id="title" placeholder="Short summary of the issue" required maxlength="80">
          </div>

          <div class="field">
            <label for="description">Description *</label>
            <textarea id="description" rows="5" placeholder="Describe the issue in detail: what happened, where, and when." required></textarea>
          </div>

          <div class="field">
            <label for="urgency">Urgency *</label>
            <select id="urgency" required>
              <option value="" disabled selected>Select urgency</option>
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
              <option value="Critical">Critical</option>
            </select>
          </div>

          <button type="submit" class="btn-primary">Submit Report</button>
          <p id="formMsg" class="form-msg" role="status"></p>
        </form>
      </div>
    </section>

    <!-- ===================== DASHBOARD ===================== -->
    <section id="dashboard" class="tab-panel">
      <div class="panel-card wide">
        <div class="dash-head">
          <h1>Reported Issues</h1>
          <div class="dash-controls">
            <select id="filterStatus">
              <option value="All">All statuses</option>
              <option value="Open">Open</option>
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
            </select>
            <select id="filterCommunity">
              <option value="All">All communities</option>
              <option value="Akungba">Akungba</option>
              <option value="Iwaro">Iwaro</option>
              <option value="Etioro">Etioro</option>
              <option value="Ayegunle">Ayegunle</option>
              <option value="Other">Other</option>
            </select>
            <button id="exportBtn" class="btn-secondary">Export JSON</button>
            <button id="clearBtn" class="btn-danger">Clear All</button>
          </div>
        </div>

        <div class="stats" id="stats"></div>

        <div id="issueList" class="issue-list"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>CSC426 Weekend 3 &mdash; IRO Prototype &copy; 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
