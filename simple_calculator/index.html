<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../simple_calculator/css/style.css">
</head>
<body>
    <h3>SIMPLE CALCULATOR </h3>
    <!-- <h1 id="raw">Rwo</h1> -->
    <main>
        <!-- calculator interface -->
        <!-- screen section -->
        <section id="result-screen">
            <div id="result">
                <div id="recent">&nbsp;</div>
                <div id="progress">&nbsp;</div>
            </div>
        </section>
        <!-- buttons and operators -->
        <section id="op-buttons">
            <ul>
                <li><button data-value="del"><img alt="del" src="svg/del.svg"></button></li>
                <li><button data-value="ac">AC</li>
                <li><button data-value="%"><img alt="%" src="svg/percent.svg"></button></li>
                <li><button data-value="/" data-operator="true"><img alt="/" src="svg/divide.svg"></button></li>
                
                <li><button data-value="7">7</button></li>
                <li><button data-value="8">8</button></li>
                <li><button data-value="9">9</button></li>
                <li><button data-value="*" data-operator="true"><img alt="*" src="svg/clear.svg"></button></li>

                <li><button data-value="4">4</button></li>
                <li><button data-value="5">5</button></li>
                <li><button data-value="6">6</button></li>
                <li><button data-value="-" data-operator="true"><img alt="-" src="svg/minus.svg"></button></li>
                
                <li><button data-value="1">1</button></li>
                <li><button data-value="2">2</button></li>
                <li><button data-value="3">3</button></li>
                <li data-span-row><button data-value="+" data-operator="true"><img alt="+" src="svg/add.svg"></button></li>

                <li><button data-value="^"><img alt="^" src="svg/caret.svg"></button></li>
                <li><button data-value="0">0</button></li>
                <li><button data-value=".">.</button></li>

                <li ><button data-value="\" type="button" data-operator="true"><img alt="\" src="svg/mod.svg"></button></li>
                <li data-span-col="2"><button data-value="=" data-operator="true"><img alt="=" src="svg/equal.svg"></button></li>

            </ul>
        </section>
    </main>

    <script src="scripts/main.js"></script>
</body>
</html>
